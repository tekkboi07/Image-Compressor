<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Compressor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <h1 class="title">Image Compressor</h1>

      <form id="compress-form" class="form">
        <div class="field">
          <label for="file">Image file</label>
          <input type="file" id="file" accept="image/*" required>
        </div>

        <div class="field">
          <label for="output_format">Output format</label>
          <select id="output_format" required>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
          </select>
        </div>

        <fieldset class="target-group">
          <legend>Target size</legend>
          <div class="target-row">
            <div class="field">
              <label for="target_kb">Size (KB)</label>
              <input type="number" id="target_kb" placeholder="e.g. 200" min="1">
            </div>

            <span class="or-badge" aria-hidden="true">OR</span>

            <div class="field">
              <label for="target_percent">Percent of original</label>
              <input type="number" id="target_percent" placeholder="e.g. 50" min="1" max="100" step="0.1">
            </div>
          </div>
        </fieldset>

        <div class="field-row">
          <div class="field">
            <label for="flip">Flip</label>
            <select id="flip">
              <option value="">None</option>
              <option value="horizontal">Horizontal</option>
              <option value="vertical">Vertical</option>
            </select>
          </div>

          <div class="field">
            <label for="rotate">Rotate</label>
            <select id="rotate">
              <option value="">None</option>
              <option value="right">Right 90°</option>
              <option value="left">Left 90°</option>
              <option value="180">180°</option>
            </select>
          </div>
        </div>

        <button type="submit" class="submit-btn">Compress</button>
      </form>

      <p id="error-message" class="error" hidden></p>

      <div id="result" class="result" hidden>
        <h2 class="result-title">Result</h2>
        <p id="result-info" class="result-readout"></p>
        <img id="result-preview" class="preview" alt="Compressed preview">
        <a id="download-link" class="download-btn" download>Download</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
